version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ai-education-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_helper}
      MYSQL_USER: ${MYSQL_USER:-aiuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aipassword}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-education-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ai-education-server
    restart: always
    ports:
      - "${SERVER_PORT:-7890}:7890"
    environment:
      # 运行环境
      RUN_ENV: ${RUN_ENV:-production}
      TMP_DIR: /app/tmp
      LOG_DIR: /app/tmp/logs
      APP_SECRET_KEY: ${APP_SECRET_KEY}

      # AI 配置
      AI_PLATFORM: ${AI_PLATFORM}
      AI_PLATFORM_KEY: ${AI_PLATFORM_KEY}
      AI_PLATFORM_URL: ${AI_PLATFORM_URL}

      # 阿里云配置
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION}
      ALIYUN_WORKSPACE_ID: ${ALIYUN_WORKSPACE_ID}
      ALIYUN_RAG_INDEX_ID: ${ALIYUN_RAG_INDEX_ID}
      ALIYUN_RAG_CATEGORY_ID: ${ALIYUN_RAG_CATEGORY_ID}

      # 数据库配置
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-aiuser}:${MYSQL_PASSWORD:-aipassword}@mysql:3306/${MYSQL_DATABASE:-ai_helper}

      # 管理员配置
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # CORS 配置
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - server_tmp:/app/tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7890/api/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 管理后台前端
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: ai-education-admin
    restart: always
    depends_on:
      - server
    networks:
      - ai-education-network

  # 学生端前端
  student:
    build:
      context: ./student
      dockerfile: Dockerfile
    container_name: ai-education-student
    restart: always
    depends_on:
      - server
    networks:
      - ai-education-network

  # Nginx 网关
  nginx:
    image: nginx:alpine
    container_name: ai-education-nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - server
      - admin
      - student
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ai-education-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  server_tmp:
    driver: local
  nginx_logs:
    driver: local
