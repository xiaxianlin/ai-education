version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: ai-education-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_helper}
      MYSQL_USER: ${MYSQL_USER:-aiuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aipassword}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-education-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  server-api:
    build:
      context: ./apps/server-api
      dockerfile: Dockerfile
    container_name: ai-education-server-api
    restart: always
    ports:
      - "${SERVER_PORT:-7890}:7890"
    environment:
      # 运行环境
      RUN_ENV: ${RUN_ENV:-production}
      TMP_DIR: /app/tmp
      LOG_DIR: /app/tmp/logs
      APP_SECRET_KEY: ${APP_SECRET_KEY}

      # AI 配置
      AI_PLATFORM: ${AI_PLATFORM}
      AI_PLATFORM_KEY: ${AI_PLATFORM_KEY}
      AI_PLATFORM_URL: ${AI_PLATFORM_URL}

      # 阿里云配置
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION}
      ALIYUN_WORKSPACE_ID: ${ALIYUN_WORKSPACE_ID}
      ALIYUN_RAG_INDEX_ID: ${ALIYUN_RAG_INDEX_ID}
      ALIYUN_RAG_CATEGORY_ID: ${ALIYUN_RAG_CATEGORY_ID}

      # 数据库配置
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-aiuser}:${MYSQL_PASSWORD:-aipassword}@mysql:3306/${MYSQL_DATABASE:-ai_helper}

      # 管理员配置
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # CORS 配置
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      
      # 服务间通信配置
      TASK_SERVICE_URL: http://server-task:7891
      AI_SERVICE_URL: http://server-ai:7892
    volumes:
      - server_tmp:/app/tmp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      server-task:
        condition: service_healthy
      server-ai:
        condition: service_healthy
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7890/api/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 任务服务
  server-task:
    build:
      context: ./apps/server-task
      dockerfile: Dockerfile
    container_name: ai-education-server-task
    restart: always
    ports:
      - "${TASK_SERVER_PORT:-7891}:7891"
    environment:
      # 运行环境
      RUN_ENV: ${RUN_ENV:-production}
      LOG_DIR: /app/tmp/logs
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
      
      # AI 配置
      AI_PLATFORM: ${AI_PLATFORM}
      AI_PLATFORM_KEY: ${AI_PLATFORM_KEY}
      AI_PLATFORM_URL: ${AI_PLATFORM_URL}
      
      # AI 服务配置
      AI_SERVICE_URL: http://server-ai:7892
      
      # Redis 配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      REDIS_DB: 0
    depends_on:
      - redis
      - server-ai
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7891/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # AI 服务
  server-ai:
    build:
      context: ./apps/server-ai
      dockerfile: Dockerfile
    container_name: ai-education-server-ai
    restart: always
    ports:
      - "${AI_SERVER_PORT:-7892}:7892"
    environment:
      # 运行环境
      RUN_ENV: ${RUN_ENV:-production}
      AI_SERVER_HOST: 0.0.0.0
      AI_SERVER_PORT: 7892
      LOG_DIR: /app/tmp/logs
      LOG_TO_FILE: ${LOG_TO_FILE:-false}
      
      # AI 配置
      AI_PLATFORM: ${AI_PLATFORM}
      AI_PLATFORM_KEY: ${AI_PLATFORM_KEY}
      AI_PLATFORM_URL: ${AI_PLATFORM_URL}
      
      # 阿里云配置
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION}
      ALIYUN_WORKSPACE_ID: ${ALIYUN_WORKSPACE_ID}
      ALIYUN_RAG_INDEX_ID: ${ALIYUN_RAG_INDEX_ID}
      ALIYUN_RAG_CATEGORY_ID: ${ALIYUN_RAG_CATEGORY_ID}
    volumes:
      - server_ai_tmp:/app/tmp
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7892/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 管理后台前端
  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: ai-education-admin-web
    restart: always
    depends_on:
      - server-api
    networks:
      - ai-education-network

  # 学生端前端
  student-web:
    build:
      context: ./apps/student-web
      dockerfile: Dockerfile
    container_name: ai-education-student-web
    restart: always
    depends_on:
      - server-api
    networks:
      - ai-education-network

  # Nginx 网关
  nginx:
    image: nginx:alpine
    container_name: ai-education-nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./infra/nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - server-api
      - admin-web
      - student-web
    networks:
      - ai-education-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ai-education-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  server_tmp:
    driver: local
  server_ai_tmp:
    driver: local
  nginx_logs:
    driver: local
