name: student_app
description: AI Education Platform - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.0.3
  hooks_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3
  state_notifier: ^1.0.0

  # 网络请求
  dio: ^5.4.0
  json_annotation: ^4.8.1

  # 路由
  go_router: ^17.0.0

  # 本地存储
  shared_preferences: ^2.2.2

  # UI 组件
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # 音频录制
  record: ^6.1.2
  permission_handler: ^12.0.1

  # 工具
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  logger: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  json_serializable: ^6.11.2
  freezed: ^3.2.3
  mockito: ^5.6.1
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

