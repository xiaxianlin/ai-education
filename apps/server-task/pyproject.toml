[project]
name = "ai-education-task"
version = "0.1.0"
description = "AI 生成任务处理服务"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.2",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "loguru>=0.7.3",
    "aiofiles>=24.1.0",
    
    # AI 相关
    "openai>=1.79.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "langchain-core>=0.3.0,<0.4.0",
    
    # 阿里云服务
    "dashscope>=1.25.0",
    
    # Redis（用于任务队列）
    "redis[hiredis]>=6.1.0",
    "rq>=1.15.0",
    
    # HTTP 客户端
    "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

