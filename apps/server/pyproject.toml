[project]
name = "ai-education-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "alibabacloud-oss-v2>=1.1.1",
    "crcmod>=1.7",
    "fastapi>=0.115.12",
    "fastrand>=3.0.6",
    "ffmpeg-python>=0.2.0",
    "pymupdf>=1.23.14",
    "greenlet>=3.2.3",
    "loguru>=0.7.3",
    "numpy>=2.3.1",
    "pydantic-settings>=2.9.1",
    "pydub>=0.25.1",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.20",
    "chardet>=5.2.0",
    "redis[hiredis]>=6.1.0",
    "sqlalchemy>=2.0.41",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "uvicorn[standard]>=0.34.2",
    "alibabacloud-bailian20231229>=2.1.0",
    "asyncmy>=0.2.10",
    "bcrypt>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "openai>=1.79.0",
    "requests>=2.31.0",
    "celery>=5.3.0",
    "celery[redis]>=5.3.0",
    "pendulum>=3.1.0",
    "langchain>=1.2.4",
    "langchain-openai>=1.1.7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.black]
line-length = 120

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
in-place = false
recursive = true
exclude = ["__pycache__", "*.pyc", ".git"]

[tool.vulture]
min_confidence = 80
exclude = ["__pycache__", "*.pyc", ".git"]
ignore_decorators = [
    "@router.get",
    "@router.post",
    "@router.put",
    "@router.delete",
    "@router.patch",
    "@app.get",
    "@app.post",
    "@app.put",
    "@app.delete",
    "@app.patch",
    "@task",
    "@app.task",
]
ignore_names = [
    "admin_app",
    "student_app",
    "app",
    "router",
    "db",
    "request",
    "response",
    "logger",
    "envs",
]
make_whitelist = false

[dependency-groups]
dev = ["autoflake>=2.3.1", "unimport>=1.3.0", "vulture>=2.14"]
